<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 100%; max-width: 500px; background: #1e1e1e; border-radius: 10px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .chat-box { height: 350px; overflow-y: auto; border: 1px solid #333; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        .input-group { display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border-radius: 5px; border: none; }
        button { padding: 10px 15px; background: #075e54; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .msg { margin: 5px 0; padding: 8px; border-radius: 5px; }
        .user { background: #075e54; align-self: flex-end; }
        .bot { background: #333; }
    </style>
</head>
<body>
    <div class="chat-container">
        <h2>Gemini AI Bot</h2>
        <div class="chat-box" id="chat-box"></div>
        <div class="input-group">
            <input type="text" id="user-input" placeholder="Mesajınızı yazın...">
            <button onclick="sendMessage()">Göndər</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            let input = document.getElementById("user-input");
            let box = document.getElementById("chat-box");
            let text = input.value.trim();
            if(!text) return;

            box.innerHTML += `<div class="msg user"><b>Siz:</b> ${text}</div>`;
            input.value = "";

            let res = await fetch("/chat", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({message: text})
            });
            let data = await res.json();
            box.innerHTML += `<div class="msg bot"><b>Bot:</b> ${data.response}</div>`;
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
