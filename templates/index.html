<!DOCTYPE html>
<html lang="az">
<head><link rel="manifest" href="/static/manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaza AI Helper</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: radial-gradient(circle at top left, #1a1c29, #0e0f17); color: #e1e1e6; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        .main-container { width: 95%; max-width: 1200px; height: 90vh; background: rgba(23, 25, 35, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; display: flex; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        
        /* Sidebar */
        .sidebar { width: 280px; background: rgba(15, 16, 24, 0.6); border-right: 1px solid rgba(255, 255, 255, 0.05); display: flex; flex-direction: column; padding: 16px; gap: 12px; }
        .new-chat-btn { background: linear-gradient(135deg, #7928CA, #FF0080); color: white; border: none; padding: 12px; border-radius: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
        .new-chat-btn:hover { opacity: 0.9; transform: translateY(-1px); }
        
        .search-box { position: relative; }
        .search-box input { width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 8px 12px 8px 32px; border-radius: 8px; color: #fff; font-size: 13px; outline: none; }
        .search-box i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #a0a0b0; font-size: 12px; }

        .chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
        .chat-item { padding: 10px 12px; background: rgba(255, 255, 255, 0.02); border: 1px solid transparent; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: #a0a0b0; transition: 0.2s; }
        .chat-item:hover, .chat-item.active { background: rgba(255, 255, 255, 0.08); border-color: rgba(121, 40, 202, 0.4); color: #fff; }
        .chat-item-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
        .delete-chat-btn { color: #ff4d4d; opacity: 0; transition: 0.2s; background: none; border: none; cursor: pointer; }
        .chat-item:hover .delete-chat-btn { opacity: 1; }

        /* Main Chat */
        .chat-card { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .header { padding: 16px 20px; background: rgba(255, 255, 255, 0.03); border-bottom: 1px solid rgba(255, 255, 255, 0.05); display: flex; align-items: center; justify-content: space-between; }
        .header-title { display: flex; align-items: center; gap: 12px; }
        .header i { font-size: 24px; color: #7928CA; }
        .header h2 { font-size: 20px; font-weight: 600; background: linear-gradient(135deg, #FF0080, #7928CA); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .auth-actions { display: flex; align-items: center; gap: 10px; }
        .user-profile { display: none; align-items: center; gap: 8px; background: rgba(255,255,255,0.08); padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .user-profile img { width: 28px; height: 28px; border-radius: 50%; }
        .user-profile span { font-size: 13px; color: #fff; font-weight: 500; }
        .logout-btn { background: none; border: none; color: #ff4d4d; cursor: pointer; font-size: 12px; margin-left: 4px; }

        .chat-body { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
        
        .msg { max-width: 80%; padding: 14px 18px; border-radius: 16px; line-height: 1.5; font-size: 15px; word-wrap: break-word; position: relative; }
        .msg img { max-width: 100%; max-height: 250px; border-radius: 10px; margin-bottom: 8px; display: block; }
        .user { align-self: flex-end; background: linear-gradient(135deg, #7928CA, #FF0080); color: white; border-bottom-right-radius: 4px; }
        .bot { align-self: flex-start; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.05); border-bottom-left-radius: 4px; }

        .speak-btn { margin-top: 6px; background: none; border: none; color: #a0a0b0; cursor: pointer; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
        .speak-btn:hover { color: #fff; }

        .typing { display: none; align-self: flex-start; background: rgba(255, 255, 255, 0.03); padding: 12px 18px; border-radius: 16px; font-size: 13px; color: #a0a0b0; }

        /* File Preview Container */
        .file-preview { display: none; padding: 8px 16px; background: rgba(255, 255, 255, 0.05); border-top: 1px solid rgba(255, 255, 255, 0.05); align-items: center; gap: 10px; }
        .file-preview img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; }
        .file-preview .file-info { font-size: 12px; color: #fff; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .file-preview .remove-file { color: #ff4d4d; cursor: pointer; background: none; border: none; font-size: 14px; }

        .input-area { padding: 16px; background: rgba(0, 0, 0, 0.2); border-top: 1px solid rgba(255, 255, 255, 0.05); display: flex; gap: 10px; align-items: center; }
        .input-area input[type="text"] { flex: 1; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 14px 18px; border-radius: 12px; color: white; outline: none; font-size: 15px; }
        .input-area input[type="text"]:focus { border-color: #7928CA; }
        
        .action-btn { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.1); width: 48px; height: 48px; border-radius: 12px; color: white; cursor: pointer; font-size: 16px; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
        .action-btn:hover { background: rgba(255, 255, 255, 0.15); }
        .action-btn.recording { background: #FF0080; animation: pulse 1s infinite; }

        .send-btn { background: linear-gradient(135deg, #7928CA, #FF0080); border: none; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="main-container">
    <div class="sidebar">
        <button class="new-chat-btn" onclick="createNewChat()"><i class="fa-solid fa-plus"></i> New Chat</button>
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="search-input" placeholder="Search chats..." oninput="filterChats()">
        </div>
        <div class="chat-list" id="chat-list"></div>
    </div>

    <div class="chat-card">
        <div class="header">
            <div class="header-title">
                <i class="fa-solid fa-robot"></i>
                <h2>Zaza AI Helper</h2>
            </div>
            <div class="auth-actions">
                <div id="google-btn-container">
                    <div id="g_id_onload"
                         data-client_id="152148942306-ur5oi5n29pvnmo44h19465tfue8rcih4.apps.googleusercontent.com"
                         data-callback="handleCredentialResponse">
                    </div>
                    <div class="g_id_signin" data-type="standard" data-size="medium" data-theme="dark" data-text="signin_with"></div>
                </div>

                <div id="user-profile" class="user-profile">
                    <img id="user-avatar" src="" alt="User">
                    <span id="user-name"></span>
                    <button class="logout-btn" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i></button>
                </div>
            </div>
        </div>

        <div class="chat-body" id="chat-body">
            <div class="typing" id="typing"><i class="fa-solid fa-circle-notch fa-spin"></i> Zaza is typing...</div>
        </div>

        <!-- Fayl Önizləmə Paneli -->
        <div class="file-preview" id="file-preview">
            <img id="preview-img" src="" alt="Preview" style="display:none;">
            <i class="fa-solid fa-file" id="preview-icon" style="display:none; font-size: 24px; color: #7928CA;"></i>
            <span class="file-info" id="file-info"></span>
            <button class="remove-file" onclick="clearSelectedFile()"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="input-area">
            <!-- Gizli Fayl Seçici Input -->
            <input type="file" id="file-input" style="display: none;" onchange="handleFileSelect(event)">
            
            <button class="action-btn" onclick="document.getElementById('file-input').click()" title="Fayl və ya Şəkil Əlavə Et">
                <i class="fa-solid fa-paperclip"></i>
            </button>

            <input type="text" id="user-input" placeholder="Mesajınızı yazın...">
            <button class="action-btn" id="mic-btn" onclick="toggleVoice()" title="Səslə Yaz"><i class="fa-solid fa-microphone"></i></button>
            <button class="action-btn send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>
</div>

<script>
    let allSessions = JSON.parse(localStorage.getItem("allSessions")) || [];
    let currentSessionId = localStorage.getItem("currentSessionId") || null;
    let selectedFileData = null;
    let selectedFileType = null;

    window.onload = () => {
        checkSavedUser();
        
        document.getElementById("user-input").addEventListener("keydown", function(e) {
            if (e.key === "Enter") {
                e.preventDefault();
                sendMessage();
            }
        });

        if (allSessions.length === 0) {
            createNewChat(false);
        } else {
            if (!currentSessionId || !allSessions.find(s => s.id === currentSessionId)) {
                currentSessionId = allSessions[0].id;
            }
            renderSidebar();
            loadChatSession(currentSessionId);
        }
    };

    function createNewChat(switchToIt = true) {
        let newSession = {
            id: 'session_' + Date.now(),
            title: 'New Chat',
            messages: []
        };
        allSessions.unshift(newSession);
        saveSessions();
        if (switchToIt) {
            currentSessionId = newSession.id;
            localStorage.setItem("currentSessionId", currentSessionId);
            renderSidebar();
            loadChatSession(currentSessionId);
        }
    }

    function saveSessions() {
        localStorage.setItem("allSessions", JSON.stringify(allSessions));
    }

    function renderSidebar(filterText = '') {
        let chatList = document.getElementById("chat-list");
        chatList.innerHTML = '';

        allSessions.forEach(session => {
            if (filterText && !session.title.toLowerCase().includes(filterText.toLowerCase())) return;

            let div = document.createElement("div");
            div.className = `chat-item ${session.id === currentSessionId ? 'active' : ''}`;
            div.onclick = () => switchChat(session.id);

            div.innerHTML = `
                <span class="chat-item-title"><i class="fa-regular fa-message"></i> ${session.title}</span>
                <button class="delete-chat-btn" onclick="deleteChat('${session.id}', event)"><i class="fa-solid fa-trash-can"></i></button>
            `;
            chatList.appendChild(div);
        });
    }

    function switchChat(sessionId) {
        currentSessionId = sessionId;
        localStorage.setItem("currentSessionId", currentSessionId);
        renderSidebar();
        loadChatSession(sessionId);
    }

    function deleteChat(sessionId, e) {
        e.stopPropagation();
        allSessions = allSessions.filter(s => s.id !== sessionId);
        saveSessions();
        if (currentSessionId === sessionId) {
            currentSessionId = allSessions.length > 0 ? allSessions[0].id : null;
            if (!currentSessionId) {
                createNewChat(true);
                return;
            }
        }
        renderSidebar();
        loadChatSession(currentSessionId);
    }

    function filterChats() {
        let text = document.getElementById("search-input").value;
        renderSidebar(text);
    }

    function loadChatSession(sessionId) {
        let session = allSessions.find(s => s.id === sessionId);
        let body = document.getElementById("chat-body");
        
        body.innerHTML = `<div class="typing" id="typing"><i class="fa-solid fa-circle-notch fa-spin"></i> Zaza is typing...</div>`;

        if (session && session.messages.length > 0) {
            session.messages.forEach(item => {
                appendMessageToDOM(item.sender, item.text, item.fileData);
            });
        }
    }

    function handleFileSelect(e) {
        const file = e.target.files[0];
        if (!file) return;

        selectedFileType = file.type;
        const reader = new FileReader();

        reader.onload = function(evt) {
            selectedFileData = evt.target.result;
            
            const previewBox = document.getElementById("file-preview");
            const previewImg = document.getElementById("preview-img");
            const previewIcon = document.getElementById("preview-icon");
            const fileInfo = document.getElementById("file-info");

            fileInfo.innerText = file.name;
            previewBox.style.display = "flex";

            if (file.type.startsWith("image/")) {
                previewImg.src = selectedFileData;
                previewImg.style.display = "block";
                previewIcon.style.display = "none";
            } else {
                previewImg.style.display = "none";
                previewIcon.style.display = "block";
            }
        };

        reader.readAsDataURL(file);
    }

    function clearSelectedFile() {
        selectedFileData = null;
        selectedFileType = null;
        document.getElementById("file-input").value = "";
        document.getElementById("file-preview").style.display = "none";
    }

    function appendMessageToDOM(sender, text, fileData = null) {
        let body = document.getElementById("chat-body");
        let typing = document.getElementById("typing");

        let msgDiv = document.createElement("div");
        msgDiv.className = `msg ${sender}`;

        if (fileData) {
            if (fileData.startsWith("data:image/")) {
                let img = document.createElement("img");
                img.src = fileData;
                msgDiv.appendChild(img);
            } else {
                let fileTag = document.createElement("div");
                fileTag.style.fontSize = "12px";
                fileTag.style.opacity = "0.8";
                fileTag.innerHTML = `<i class="fa-solid fa-paperclip"></i> [Əlavə olunmuş fayl]`;
                msgDiv.appendChild(fileTag);
            }
        }

        if (text) {
            let txtSpan = document.createElement("span");
            txtSpan.innerHTML = text.replace(/\n/g, '<br>');
            msgDiv.appendChild(txtSpan);
        }

        if (sender === 'bot') {
            let speakBtn = document.createElement("button");
            speakBtn.className = "speak-btn";
            speakBtn.innerHTML = `<i class="fa-solid fa-volume-high"></i> Speak`;
            speakBtn.onclick = () => speakText(msgDiv.innerText.replace('Speak', ''));
            msgDiv.appendChild(document.createElement("br"));
            msgDiv.appendChild(speakBtn);
        }

        body.insertBefore(msgDiv, typing);
        body.scrollTop = body.scrollHeight;
        return msgDiv;
    }

    async function sendMessage(textOverride = null) {
        let input = document.getElementById("user-input");
        let typing = document.getElementById("typing");
        let text = textOverride || input.value.trim();

        if (!text && !selectedFileData) return;

        let session = allSessions.find(s => s.id === currentSessionId);
        if (!session) return;

        if (session.messages.length === 0) {
            session.title = (text || "Fayl/Şəkil").slice(0, 25);
            renderSidebar();
        }

        appendMessageToDOM("user", text, selectedFileData);
        session.messages.push({ sender: "user", text, fileData: selectedFileData });
        saveSessions();

        let reqPayload = {
            message: text,
            file_data: selectedFileData,
            file_type: selectedFileType
        };

        if (!textOverride) input.value = "";
        clearSelectedFile();

        typing.style.display = "block";
        let body = document.getElementById("chat-body");
        body.scrollTop = body.scrollHeight;

        try {
            let res = await fetch("/chat", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(reqPayload)
            });

            let data = await res.json();
            typing.style.display = "none";

            appendMessageToDOM("bot", data.response);
            session.messages.push({ sender: "bot", text: data.response });
            saveSessions();

        } catch (e) {
            typing.style.display = "none";
            appendMessageToDOM("bot", "Xəta baş verdi, xahiş olunur yenidən cəhd edin.");
        }
    }

    /* Google Login */
    function parseJwt(token) {
        try {
            let base64Url = token.split('.')[1];
            let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            let jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        } catch (e) {
            return null;
        }
    }

    function handleCredentialResponse(response) {
        const userData = parseJwt(response.credential);
        if (userData) {
            localStorage.setItem("googleUser", JSON.stringify(userData));
            showUserProfile(userData);
        }
    }

    function showUserProfile(user) {
        document.getElementById("google-btn-container").style.display = "none";
        const profileDiv = document.getElementById("user-profile");
        document.getElementById("user-avatar").src = user.picture;
        document.getElementById("user-name").innerText = user.given_name || user.name;
        profileDiv.style.display = "flex";
    }

    function checkSavedUser() {
        const savedUser = localStorage.getItem("googleUser");
        if (savedUser) {
            showUserProfile(JSON.parse(savedUser));
        }
    }

    function logout() {
        localStorage.removeItem("googleUser");
        document.getElementById("user-profile").style.display = "none";
        document.getElementById("google-btn-container").style.display = "block";
    }

    /* Səs Tanıma (Mikrofon Həlli) */
    let recognition;
    function toggleVoice() {
        let micBtn = document.getElementById("mic-btn");
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            alert("Brauzeriniz səs tanıma funksiyasını dəstəkləmir. Chrome və ya Edge istifadə edin.");
            return;
        }

        if (recognition && micBtn.classList.contains("recording")) {
            recognition.stop();
            micBtn.classList.remove("recording");
            return;
        }

        recognition = new SpeechRecognition();
        recognition.lang = 'az-AZ'; // Azərbaycan dili dəstəyi
        recognition.interimResults = false;

        recognition.start();
        micBtn.classList.add("recording");

        recognition.onresult = (event) => {
            let transcript = event.results[0][0].transcript;
            document.getElementById("user-input").value = transcript;
            micBtn.classList.remove("recording");
            sendMessage();
        };

        recognition.onerror = (e) => {
            console.error("Səs xətası:", e);
            micBtn.classList.remove("recording");
            alert("Səs tanınmadı və ya mikrofona icazə verilmədi.");
        };

        recognition.onend = () => micBtn.classList.remove("recording");
    }

    function speakText(text) {
        let synth = window.speechSynthesis;
        let utterance = new SpeechSynthesisUtterance(text);
        synth.speak(utterance);
    }
</script>

</body>
</html>
