<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaza AI Helper</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#202123">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #343541; color: #ececf1; height: 100vh; display: flex; overflow: hidden; }
        
        /* Sidebar Styles */
        #sidebar { width: 260px; background: #202123; display: flex; flex-direction: column; padding: 10px; border-right: 1px solid #4d4d4f; }
        .new-chat-btn { background: transparent; border: 1px solid #565869; color: #fff; padding: 10px; border-radius: 6px; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 10px; font-size: 14px; margin-bottom: 10px; }
        .new-chat-btn:hover { background: #2a2b32; }
        #history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .history-item { padding: 10px; border-radius: 6px; cursor: pointer; font-size: 13px; color: #c5c5d2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .history-item:hover, .history-item.active { background: #343541; color: #fff; }

        /* Main Content Area */
        #main-content { flex: 1; display: flex; flex-direction: column; height: 100vh; }
        header { background: #343541; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #4d4d4f; }
        .header-title { font-size: 16px; font-weight: 600; }
        button.btn-icon { background: transparent; border: 1px solid #565869; color: #ececf1; border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        button.btn-icon:hover { background: #40414f; }
        button.btn-icon.active { background: #10a37f; border-color: #10a37f; color: #fff; }

        #chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
        .message { display: flex; gap: 12px; max-width: 800px; margin: 0 auto; width: 100%; padding: 12px; border-radius: 8px; }
        .message.user { background: #343541; }
        .message.bot { background: #444654; }
        .avatar { width: 30px; height: 30px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; flex-shrink: 0; }
        .user .avatar { background: #5436da; }
        .bot .avatar { background: #10a37f; }
        .content { font-size: 15px; line-height: 1.5; word-break: break-word; flex: 1; }

        footer { background: #343541; padding: 12px 16px; }
        .input-box { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
        .controls { display: flex; gap: 8px; align-items: center; background: #40414f; border-radius: 8px; padding: 8px 12px; }
        textarea { flex: 1; background: transparent; border: none; color: #fff; font-size: 15px; resize: none; outline: none; height: 24px; max-height: 150px; }
        .input-btn { background: transparent; border: none; color: #acacbe; cursor: pointer; padding: 4px; border-radius: 4px; }
        .input-btn:hover { color: #fff; }
        .media-preview-container { display: flex; align-items: center; gap: 8px; background: #202123; padding: 6px 12px; border-radius: 6px; font-size: 12px; }
        .live-status { text-align: center; font-size: 12px; color: #10a37f; display: none; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Left Sidebar -->
    <div id="sidebar">
        <button class="new-chat-btn" onclick="startNewChat()">➕ New Chat</button>
        <div id="history-list"></div>
    </div>

    <!-- Main Content Area -->
    <div id="main-content">
        <header>
            <div class="header-title">🤖 Zaza AI Helper</div>
            <button id="btn-live-voice" class="btn-icon" onclick="toggleLiveVoice()">🎙️ Live Voice</button>
        </header>

        <div id="chat-container"></div>

        <footer>
            <div class="input-box">
                <div id="media-preview" class="media-preview-container" style="display:none;">
                    <span id="preview-text"></span>
                    <button onclick="clearMedia()" style="background:none; border:none; color:#ef4444; cursor:pointer; margin-left:auto;">❌</button>
                </div>
                <div id="live-indicator" class="live-status">🔴 Live Voice Active - Listening...</div>
                <div class="controls">
                    <label for="file-input" class="input-btn" title="Attach File">📎</label>
                    <input type="file" id="file-input" style="display:none;" onchange="handleFileSelect(event)">
                    
                    <textarea id="user-input" placeholder="Message Zaza..." rows="1" onkeydown="handleKeyDown(event)"></textarea>
                    
                    <button class="input-btn" onclick="sendMessage()">➔</button>
                </div>
            </div>
        </footer>
    </div>

    <script>
        const socket = io();
        let chats = JSON.parse(localStorage.getItem('zaza_chats') || '[]');
        let currentChatId = null;
        let selectedFileBase64 = null;
        let selectedFileType = null;
        let isLiveVoiceActive = false;

        // Speech Recognition Setup
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                const lastIndex = event.results.length - 1;
                const transcript = event.results[lastIndex][0].transcript.trim();
                
                if (transcript) {
                    document.getElementById('user-input').value = transcript;
                    sendMessage();
                }
            };

            recognition.onerror = (event) => {
                console.error("Speech Recognition Error:", event.error);
                if (event.error === 'not-allowed') {
                    alert("Please allow microphone access in your browser settings!");
                }
            };

            recognition.onend = () => {
                if (isLiveVoiceActive) {
                    try { recognition.start(); } catch(e) {}
                }
            };
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                window.speechSynthesis.speak(utterance);
            }
        }

        function init() {
            renderHistory();
            if (chats.length > 0) {
                loadChat(chats[0].id);
            } else {
                startNewChat();
            }
        }

        function saveChats() {
            localStorage.setItem('zaza_chats', JSON.stringify(chats));
            renderHistory();
        }

        function startNewChat() {
            currentChatId = Date.now().toString();
            chats.unshift({ id: currentChatId, title: "New Chat", messages: [] });
            saveChats();
            loadChat(currentChatId);
        }

        function loadChat(id) {
            currentChatId = id;
            const chat = chats.find(c => c.id === id);
            const container = document.getElementById('chat-container');
            container.innerHTML = '';
            
            if (chat) {
                chat.messages.forEach(m => appendMessageToDOM(m.sender, m.text));
            }
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = '';
            chats.forEach(c => {
                const item = document.createElement('div');
                item.className = `history-item ${c.id === currentChatId ? 'active' : ''}`;
                item.innerText = c.title || "New Chat";
                item.onclick = () => loadChat(c.id);
                list.appendChild(item);
            });
        }

        function appendMessageToDOM(sender, text) {
            const container = document.getElementById('chat-container');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.innerText = sender === 'user' ? 'You' : 'Zaza';

            const content = document.createElement('div');
            content.className = 'content';
            content.innerText = text;

            msgDiv.appendChild(avatar);
            msgDiv.appendChild(content);
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text && !selectedFileBase64) return;

            appendMessageToDOM('user', text || "[File Sent]");
            
            const currentChat = chats.find(c => c.id === currentChatId);
            if (currentChat) {
                if (currentChat.messages.length === 0 && text) {
                    currentChat.title = text.substring(0, 20) + "...";
                }
                currentChat.messages.push({ sender: 'user', text: text || "[File Sent]" });
            }

            input.value = '';
            const payload = { message: text, file_data: selectedFileBase64, file_type: selectedFileType };
            clearMedia();

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                
                appendMessageToDOM('bot', data.response);
                
                if (isLiveVoiceActive) {
                    speakText(data.response);
                }

                if (currentChat) {
                    currentChat.messages.push({ sender: 'bot', text: data.response });
                    saveChats();
                }
            } catch (err) {
                appendMessageToDOM('bot', "An error occurred, please try again.");
            }
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            selectedFileType = file.type;
            const reader = new FileReader();
            reader.onload = function(evt) {
                selectedFileBase64 = evt.target.result;
                document.getElementById('preview-text').innerText = `File: ${file.name}`;
                document.getElementById('media-preview').style.display = 'flex';
            };
            reader.readAsDataURL(file);
        }

        function clearMedia() {
            selectedFileBase64 = null;
            selectedFileType = null;
            document.getElementById('file-input').value = '';
            document.getElementById('media-preview').style.display = 'none';
        }

        function toggleLiveVoice() {
            const btn = document.getElementById('btn-live-voice');
            const indicator = document.getElementById('live-indicator');

            if (!recognition) {
                alert("Speech recognition is not supported in this browser. Please use Google Chrome.");
                return;
            }

            if (!isLiveVoiceActive) {
                isLiveVoiceActive = true;
                try {
                    recognition.start();
                    btn.classList.add('active');
                    indicator.style.display = 'block';
                } catch (err) {
                    console.error(err);
                }
            } else {
                isLiveVoiceActive = false;
                recognition.stop();
                btn.classList.remove('active');
                indicator.style.display = 'none';
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                }
            }
        }

        init();
    </script>
</body>
</html>
